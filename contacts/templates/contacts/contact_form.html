<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>فرم مخاطب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; }
        .card-header { background: linear-gradient(135deg, #198754, #20c997); color: white; }
        .card {
            animation: popIn 0.4s ease;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .form-control, .form-select {
            transition: all 0.2s ease;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(25,135,84,0.25);
            border-color: #198754;
        }
        .btn {
            transition: all 0.25s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header py-3">
                    <h4 class="mb-0">{% if contact %}✏️ ویرایش مخاطب{% else %}➕ افزودن مخاطب{% endif %}</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">نام</label>
                            <input type="text" name="first_name" class="form-control" value="{{ contact.first_name|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">نام خانوادگی</label>
                            <input type="text" name="last_name" class="form-control" value="{{ contact.last_name|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">تلفن</label>
                            <input type="text" name="phone" class="form-control" value="{{ contact.phone|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ایمیل</label>
                            <input type="email" name="email" class="form-control" value="{{ contact.email|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">آدرس</label>
                            <input type="text" name="address" class="form-control" value="{{ contact.address|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">دسته‌بندی</label>
                            <select name="category" class="form-select">
                                {% for value, label in categories %}
                                <option value="{{ value }}" {% if contact.category == value %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">ذخیره</button>
                        <a href="{% url 'contact_list' %}" class="btn btn-outline-secondary w-100 mt-2">انصراف</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
