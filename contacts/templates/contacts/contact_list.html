<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>دفترچه مخاطبین</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; }
        .card-header { background: linear-gradient(135deg, #198754, #20c997); color: white; }
        .card {
            animation: fadeSlideIn 0.5s ease;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn {
            transition: all 0.25s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.2);
        }
        .btn-sm:hover {
            transform: translateY(-2px) scale(1.05);
        }
        table tbody tr {
            transition: background 0.2s ease;
        }
        table tbody tr:hover {
            background: #eafaf1;
        }
        .badge {
            transition: transform 0.2s ease;
        }
        .badge:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center py-3">
            <h3 class="mb-0">📇 دفترچه مخاطبین</h3>
            <a href="{% url 'contact_add' %}" class="btn btn-light fw-bold">+ افزودن مخاطب</a>
        </div>
        <div class="card-body">
            <form method="get" class="d-flex mb-3">
                <input type="text" name="q" value="{{ query }}" class="form-control me-2" placeholder="جستجو بر اساس نام یا تلفن...">
                <button type="submit" class="btn btn-primary">جستجو</button>
            </form>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-success">
                        <tr>
                            <th>نام</th>
                            <th>نام خانوادگی</th>
                            <th>تلفن</th>
                            <th>دسته‌بندی</th>
                            <th>ایمیل</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for contact in contacts %}
                        <tr>
                            <td>{{ contact.first_name }}</td>
                            <td>{{ contact.last_name }}</td>
                            <td>{{ contact.phone }}</td>
                            <td><span class="badge bg-info text-dark">{{ contact.get_category_display }}</span></td>
                            <td>{{ contact.email }}</td>
                            <td>
                                <a href="{% url 'contact_edit' contact.pk %}" class="btn btn-sm btn-primary">ویرایش</a>
                                <a href="{% url 'contact_delete' contact.pk %}" class="btn btn-sm btn-danger">حذف</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr><td colspan="6" class="text-center text-muted py-4">هنوز مخاطبی اضافه نشده.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
