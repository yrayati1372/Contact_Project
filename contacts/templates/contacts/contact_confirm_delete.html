<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>حذف مخاطب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; }
        .card {
            animation: popIn 0.4s ease;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .btn {
            transition: all 0.25s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-danger">
                <div class="card-body text-center">
                    <h4 class="mb-3">⚠️ حذف مخاطب</h4>
                    <p>مطمئنی می‌خوای <strong>«{{ contact.first_name }} {{ contact.last_name }}»</strong> رو حذف کنی؟</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger w-100">بله، حذف کن</button>
                        <a href="{% url 'contact_list' %}" class="btn btn-outline-secondary w-100 mt-2">انصراف</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
